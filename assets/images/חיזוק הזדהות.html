    (function () {
      function handleVisibilityChange() {
        if (!document.hidden) {
          var sessionStorageKey = 'App_sessionlosttime';
          var sessionLostTime = sessionStorage && sessionStorage.getItem(sessionStorageKey);

          if (sessionLostTime) {
            sessionLostTime = parseInt(sessionLostTime);
            if (new Date().getTime() >= sessionLostTime) {
              sessionStorage.removeItem(sessionStorageKey);
              window.location.reload();
            }
          }
        }
      }

      function isMobile() {
        var userAgent = navigator.userAgent.toLowerCase();
        return !!(
          userAgent.match(/android/i)
          || userAgent.match(/iphone/i)
          || userAgent.match(/ipad/i)
          || userAgent.match(/ipod/i)
          || userAgent.match(/windows phone/i)
        );
      }

      if (isMobile()) {
        document.addEventListener('visibilitychange', function () {
          try {
            handleVisibilityChange();
          } catch (e) {
          }
        }, false);
      }

    })();
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      bnhpApp.pwaBanner = e;
    });
  </script>

            function getChatbotPosition(el) {
                const position = el.getBoundingClientRect();
                return {
                  x: position.left,
                  y: position.top
                };
            }
            
            function dragChatbot() {
                document.body.classList.add('body');
                let style = document.createElement('style');
                style.textContent = '.warp-chat { position: absolute; width: 78%; height: 100%; z-index: 999; }';             
                let iframeParent = document.querySelector('.chat-iframe-parent');
                let dragItem = Object.assign(document.createElement('div'), {className: 'warp-chat'});
                let firstPosition = getChatbotPosition(dragItem);
            
                iframeParent.appendChild(dragItem);
            
                let container = document.querySelector('.body');
                container.appendChild(style);
            
                let active = false, currentX, currentY, initialX, initialY, xOffset = 0, yOffset = 0, click;
            
                iframeParent.addEventListener('touchstart', dragStart, false);
                iframeParent.addEventListener('touchend', dragEnd, false);
                iframeParent.addEventListener('touchmove', drag, false);
            
                iframeParent.addEventListener('mousedown', dragStart, false);
                iframeParent.addEventListener('mouseup', dragEnd, false);
                document.addEventListener('mousemove', drag, false);
            
                Interactbot.on('open-chat', () => {
                  dragItem.style.display = 'none';
                });
            
                Interactbot.on('close-chat', () => {
                  dragItem.style.display = 'block';
                });
            
                function dragStart(e) {
                  click = true;
                  if (e.type === 'touchstart') {
                    initialX = e.touches[0].clientX - xOffset;
                    initialY = e.touches[0].clientY - yOffset;
                  } else {
                    initialX = e.clientX - xOffset;
                    initialY = e.clientY - yOffset;
                  }
            
                  if (e.target === dragItem) {
                    active = true;
                  }
                }
            
                function dragEnd(e) {
                  if (click) {
                    currentX = firstPosition.x;
                    currentY = firstPosition.y;
            
                    xOffset = currentX;
                    yOffset = currentY;
            
                    setTranslate(currentX, currentY, iframeParent);
                    Interactbot.open();
                  }
                  initialX = currentX;
                  initialY = currentY;
                  active = false;
                }
            
                function drag(e) {
                  click = false;
                  if (active) {
                    e.preventDefault();
            
                    if (e.type === 'touchmove') {
                      currentX = e.touches[0].clientX - initialX;
                      currentY = e.touches[0].clientY - initialY;
                    } else {
                      currentX = e.clientX - initialX;
                      currentY = e.clientY - initialY;
                    }
            
                    xOffset = currentX;
                    yOffset = currentY;
            
                    setTranslate(currentX, currentY, iframeParent);
                  }
                }
            
                function setTranslate(xPos, yPos, el) {
                  el.style.transform = 'translate3d(' + xPos + 'px, ' + yPos + 'px, 0)';
                }
            }
              
            Interactbot.on('load', () => {
                dragChatbot();
            });
